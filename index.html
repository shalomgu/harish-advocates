        <h1>חריש עורכי דין – משרד עורכי דין בגבעתיים</h1>
        <p>
          חריש עורכי דין הוא משרד עורכי דין ותיק בגבעתיים, שנוסד בשנת 1996 על ידי
          עו״ד ליאור חריש. המשרד מעניק שירות משפטי מקצועי, אישי ומהיר, מתוך מחויבות
          למצוינות וחשיבה יצירתית „מחוץ לקופסא“.
        </p>

        <h2>הצוות</h2>
        <ul>
          <li><strong>עו״ד ליאור חריש</strong> – מייסד המשרד, עורך דין משנת 1995, מגשר מוסמך, מתמחה בתקשורת ומדיה, מקרקעין, תאגידים, צוואות וירושות, דיני עבודה וזכויות בעלי חיים.</li>
          <li><strong>עו״ד איריס חריש</strong> – מתמחה בדיני עבודה, זכויות יוצרים וקניין רוחני.</li>
        </ul>

        <h2>תחומי עיסוק</h2>
        <ul>
          <li><strong>מקרקעין ונדל״ן</strong> – רכישה ומכירת דירות ובתים, חוזי שכירות, עסקאות קבלן, מיסוי מקרקעין.</li>
          <li><strong>משפט מסחרי ותאגידים</strong> – הקמת חברות ועמותות, חוזים מסחריים, הסכמי שותפות, ליווי עסקי.</li>
          <li><strong>דיני ירושה ועזבונות</strong> – עריכת צוואות, צווי ירושה, ייפוי כוח מתמשך, ניהול עזבונות.</li>
          <li><strong>תקשורת, מדיה ואינטרנט</strong> – ייצוג גופי שידור, מכרזי תקשורת, קניין רוחני, לשון הרע והגנת הפרטיות.</li>
          <li><strong>דיני עבודה</strong> – הסכמי העסקה, זכויות סוציאליות, תביעות שכר, הטרדה מינית והתעמרות בעבודה.</li>
          <li><strong>קשרי ממשל ורגולציה</strong> – ליווי הליכי חקיקה, מכרזים מורכבים, קשר מול גופי ממשל.</li>
        </ul>
